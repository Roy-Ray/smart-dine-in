<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Tracking - Smart Dine-In</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #0f172a 0%, #0b1220 100%);
        min-height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #e2e8f0;
      }
      .tracking-container {
        max-width: 500px;
        margin: 40px auto;
        background: #0f172a;
        border-radius: 18px;
        box-shadow: 0 6px 28px rgba(6, 182, 212, 0.06);
        padding: 32px 24px 24px 24px;
        border: 1px solid rgba(6, 182, 212, 0.06);
      }
      .tracking-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .tracking-header i {
        color: var(--accent1);
        font-size: 2rem;
      }
      .tracking-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text);
      }
      .order-id {
        font-size: 1rem;
        color: var(--accent1);
        margin-bottom: 10px;
      }
      .order-details {
        margin-bottom: 18px;
        font-size: 1rem;
        color: #444;
      }
      .status-steps {
        display: flex;
        justify-content: space-between;
        margin: 24px 0 18px 0;
        position: relative;
      }
      .status-steps::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 8%;
        right: 8%;
        height: 4px;
        background: #e0c3fc;
        z-index: 0;
        border-radius: 2px;
        transform: translateY(-50%);
      }
      .step {
        position: relative;
        z-index: 1;
        background: #0f172a;
        border-radius: 50%;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        color: var(--muted);
        border: 2px solid rgba(6, 182, 212, 0.12);
        transition: all 0.2s;
      }
      .step.active {
        color: #fff;
        background: var(--accent1);
        border-color: var(--accent1);
        box-shadow: 0 2px 12px rgba(6, 182, 212, 0.18);
      }
      .step-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 0.92rem;
        color: var(--muted);
      }
      .step-labels span.active {
        color: var(--accent1);
        font-weight: 600;
      }
      .order-items {
        margin: 18px 0 10px 0;
        padding: 0;
        list-style: none;
      }
      .order-items li {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 1rem;
      }
      .order-total {
        text-align: right;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text);
        margin-top: 8px;
      }
      .refresh-btn {
        display: block;
        margin: 24px auto 0 auto;
        background: linear-gradient(135deg, var(--accent1), var(--accent2));
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 28px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }
      .refresh-btn:hover {
        background: linear-gradient(135deg, #06b6d4, #fbbf24);
      }
      .no-order {
        text-align: center;
        color: #888;
        margin: 40px 0 0 0;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="tracking-container">
      <div class="tracking-header">
        <i class="fa-solid fa-utensils"></i>
        <span class="tracking-title">Track Your Order</span>
      </div>
      <div id="orderTrackingContent">
        <!-- Order tracking details will be injected here by JS -->
      </div>
      <button class="refresh-btn" onclick="refreshOrderStatus()">
        <i class="fa-solid fa-rotate"></i> Refresh
      </button>
    </div>
    <script src="order-tracking.js"></script>
  </body>
</html>
