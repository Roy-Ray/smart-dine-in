<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Smart Dine-In</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      
    .auth-container {
    max-width: 400px;
    margin: 100px auto;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    background: #010819;
    border: 1px solid rgba(50, 173, 194, 0.06);
    
  }
  

  .auth-container input {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: 1px solid rgba(95, 5, 55, 0.12);
    border-radius: 5px;
    background: #97a6d3;
    color: #f1f5f9;
  }
  
  .toggle-link {
    color: #fbbf24;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 15px;
    display: inline-block;
  }
</style>
  </head>
  <body style="background: var(--bg)">
    <header>
      <div class="container nav">
        <h1 class="logo">
          <a href="/" style="color: inherit; text-decoration: none"
            >Smart Dine-In</a
          >
        </h1>
      </div>
    </header>

    <div class="container">
      <div class="auth-container" id="loginBox">
        <h2>Welcome Back</h2>
<p>Access your Smart Dine-In account</p>

        <form id="loginForm">
          <input
            type="email"
            id="loginEmail"
            placeholder="Email Address"
            required
          />
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          />
          <button type="submit" class="btn" style="width: 100%">Login</button>
        </form>
        <span class="toggle-link" onclick="toggleAuth()"
          >Don't have an account? Register here.</span
        >
      </div>

      <div class="auth-container" id="registerBox" style="display: none">
        <h2>Create Account</h2>
<p>Create your Smart Dine-In customer account</p>
        <form id="registerForm">
          <input type="text" id="regName" placeholder="Full Name" required />
          <input
            type="email"
            id="regEmail"
            placeholder="Email Address"
            required
          />
          <input
            type="password"
            id="regPassword"
            placeholder="Password"
            required
          />
          <button type="submit" class="btn" style="width: 100%">
            Register
          </button>
        </form>
        <span class="toggle-link" onclick="toggleAuth()"
          >Already have an account? Login here.</span
        >
      </div>
    </div>

    <script src="/login.js"></script>
  </body>
</html>
