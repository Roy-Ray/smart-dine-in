<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Smart Dine-In</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* Completely Redesigned Premium Admin UI */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body, html {
        height: 100%;
        font-family: 'Poppins', sans-serif;
      }

      .admin-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Premium subtle background */
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        padding: 1rem;
      }

      .admin-box {
        background: #ffffff;
        padding: 3.5rem 3rem;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
        max-width: 440px;
        width: 100%;
        animation: slideUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        position: relative;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Top Icon Area */
      .icon-wrapper {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        color: white;
        font-size: 1.8rem;
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .admin-box h1 {
        text-align: center;
        color: #1a202c;
        font-size: 1.7rem;
        font-weight: 700;
        margin-bottom: 0.3rem;
      }

      .admin-box .subtitle {
        text-align: center;
        color: #718096;
        margin-bottom: 2.5rem;
        font-size: 0.95rem;
      }

      /* Modern Form Inputs */
      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #4a5568;
        font-weight: 500;
        font-size: 0.9rem;
      }

      .form-group label i {
        margin-right: 5px;
        color: #a0aec0;
      }

      .input-wrapper {
        position: relative;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.9rem 1.2rem;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        background: #f7fafc;
        font-family: inherit;
        font-size: 0.95rem;
        color: #2d3748;
        transition: all 0.3s ease;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
      }

      .form-group input::placeholder {
        color: #a0aec0;
      }

      /* Errors & Loading */
      .error-msg {
        background: #fff5f5;
        border-left: 4px solid #fc8181;
        color: #c53030;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        display: none;
        animation: fadeIn 0.3s ease;
      }

      .error-msg.show {
        display: block;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* Button */
      .btn-admin {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 0.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
      }

      .btn-admin:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }

      .btn-admin:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }

      /* Links & Footer */
      .back-link {
        text-align: center;
        margin-top: 1.8rem;
      }

      .back-link a {
        color: #a0aec0;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
        transition: color 0.3s;
      }

      .back-link a:hover {
        color: #667eea;
      }

      /* Redesigned Demo Credentials Box */
      .demo-box {
        background: #ebf4ff;
        border: 1px solid #c3dafe;
        padding: 1rem 1.2rem;
        border-radius: 12px;
        margin-top: 2rem;
        font-size: 0.85rem;
        color: #4a5568;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .demo-box i {
        color: #667eea;
        font-size: 1.2rem;
        margin-top: 2px;
      }

      .demo-info p {
        margin-bottom: 0.3rem;
        line-height: 1.4;
      }
      .demo-info p:last-child {
        margin-bottom: 0;
      }

      /* Loader */
      .loading {
        display: none;
        text-align: center;
        margin-bottom: 1rem;
      }
      .loading.show {
        display: block;
      }
      .spinner-small {
        border: 3px solid rgba(102, 126, 234, 0.1);
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        animation: spin 1s linear infinite;
        margin: 0 auto 0.5rem;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div class="admin-container">
      <div class="admin-box">
        
        <div class="icon-wrapper">
          <i class="fas fa-shield-alt"></i>
        </div>
        
        <h1>Staff Portal</h1>
        <p class="subtitle">Secure Login for Smart Dine-In</p>

        <form onsubmit="handleAdminLogin(event)">
          <div class="error-msg" id="errorMsg"></div>

          <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="adminEmail"
                placeholder="admin@smartdine.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-key"></i> Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="adminPassword"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-user-tag"></i> Access Role</label>
            <div class="input-wrapper">
              <select id="adminRole" required>
                <option value="" disabled selected>Select assigned role</option>
                <option value="admin">Admin (Full Access)</option>
                <option value="manager">Manager (Order Management)</option>
                <option value="staff">Staff (View Only)</option>
              </select>
            </div>
          </div>

          <div class="loading" id="loading">
            <div class="spinner-small"></div>
            <p style="color: #718096; font-size: 0.85rem;">Authenticating...</p>
          </div>

          <button type="submit" class="btn-admin" id="loginBtn">
            Sign In <i class="fas fa-arrow-right" style="font-size: 0.8rem; margin-top: 2px;"></i>
          </button>
        </form>

        <div class="back-link">
          <a href="/"><i class="fas fa-arrow-left" style="margin-right: 5px;"></i> Return to Website</a>
        </div>

        <div class="demo-box">
          <i class="fas fa-info-circle"></i>
          <div class="demo-info">
            <p style="font-weight: 600; color: #2d3748;">System Access Credentials:</p>
            <p><strong>Email:</strong> admin@smartdine.com</p>
            <p><strong>Pass:</strong> Admin@123</p>
          </div>
        </div>

      </div>
    </div>

    <script src="/admin-login.js"></script>
  </body>
</html>
